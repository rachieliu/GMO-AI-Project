version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MONGO_URI=mongodb+srv://rachieliu10:gmoAIProject2024@gmocluster.b2h9x.mongodb.net/?retryWrites=true&w=majority&appName=GMOCluster
    depends_on:
      - mongo
    command: gunicorn -w 4 -b 0.0.0.0:8000 app:app

  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
